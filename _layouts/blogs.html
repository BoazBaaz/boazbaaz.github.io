---
layout: default
---

<div class="blogs-page">
  {% if site.blogs.size > 0 %}
    {% assign sorted_blogs = site.blogs | sort: 'date' | reverse %}
    <div class="blog-cards">
      {% for blog in sorted_blogs %}
        {% include blog-card.html blog=blog tag_mode="filter" %}
      {% endfor %}
    </div>
  {% else %}
    <p>No posts yet.</p>
  {% endif %}
</div>
